<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0077b6" />
    <title>StartFit Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(0, 180, 216, 0.18), transparent 35%),
          linear-gradient(180deg, #0d1f2d, #070b10);
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: min(92vw, 420px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 28px;
        background: rgba(13, 17, 23, 0.88);
        padding: 28px;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      }
      img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 22px;
        box-shadow: 0 0 24px rgba(0,180,216,0.35);
      }
      h1 { margin: 16px 0 8px; font-size: 1.6rem; }
      p { margin: 0; color: rgba(255,255,255,0.68); line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 18px;
        border-radius: 16px;
        color: #00111a;
        background: #48cae4;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.jpg" alt="StartFit" />
      <h1>Modo offline</h1>
      <p>O StartFit App nao encontrou conexao no momento. Quando a internet voltar, abra novamente para sincronizar a demonstracao.</p>
      <a href="/">Tentar novamente</a>
    </div>
  </body>
</html>
